<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Offline | Navigator Kids AI™</title>
    
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;700&family=Lato:wght@400;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    
    <link rel="stylesheet" href="styles.css">
    
    <style>
        /* === PAGE SPECIFIC STYLES === */
        body {
            background-color: var(--color-background);
            color: var(--color-text);
            font-family: 'Lato', sans-serif;
            margin: 0;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .offline-container {
            text-align: center;
            padding: 40px 24px;
            max-width: 600px;
            background: white;
            border-radius: var(--border-radius-lg);
            box-shadow: var(--shadow-lg);
            border-top: 6px solid var(--color-primary);
        }

        .offline-icon {
            font-size: 5rem;
            margin-bottom: 24px;
            color: var(--color-text-muted);
            opacity: 0.5;
        }

        .offline-title {
            color: var(--color-primary);
            font-family: 'Inter', sans-serif;
            font-size: 2rem;
            margin-bottom: 16px;
        }

        .offline-message {
            font-size: 1.1rem;
            color: var(--color-text-muted);
            margin-bottom: 32px;
            line-height: 1.6;
        }

        /* Button Style (Self-contained in case styles.css fails to load) */
        .btn-retry {
            display: inline-flex;
            align-items: center;
            gap: 10px;
            background-color: var(--color-highlight);
            color: white;
            padding: 14px 28px;
            border: none;
            border-radius: 100px;
            font-size: 1rem;
            font-weight: 700;
            cursor: pointer;
            transition: all 0.3s ease;
            text-decoration: none;
            box-shadow: 0 4px 12px rgba(42, 157, 143, 0.3);
        }

        .btn-retry:hover {
            background-color: var(--color-highlight-dark);
            transform: translateY(-2px);
        }
    </style>
</head>
<body>

    <div class="offline-container">
        <div class="offline-icon">
            <i class="fas fa-satellite-dish"></i>
        </div>
        
        <h1 class="offline-title">Mission Control Offline</h1>
        
        <p class="offline-message">
            We've lost connection to the mothership. Don't worry—your <strong>Calm-Down Kit</strong> and other downloaded resources are still available on your device.
        </p>
        
        <button onclick="window.location.reload()" class="btn-retry">
            <i class="fas fa-sync-alt"></i> Try Reconnecting
        </button>
    </div>

</body>
</html>
